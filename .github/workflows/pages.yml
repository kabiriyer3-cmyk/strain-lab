name: Build & deploy

# Every push to main: install -> Strain tests -> bundle -> downloadable build + GitHub Pages.
# One-time setup: Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Strain tests (every scene must stand at rest)
        run: node --test tests/core.test.mjs
        timeout-minutes: 5
        continue-on-error: true

      - name: Build
        run: npm run build

      - name: Upload build (unzip and open index.html, works offline)
        uses: actions/upload-artifact@v4
        with:
          name: strain-lab-web
          path: dist
          include-hidden-files: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
